name: wa_blast
description: "Wave Up"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  device_info_plus: ^11.5.0
  flutter:
    sdk: flutter
  http: ^1.4.0
  lucide_icons: ^0.257.0
  provider: ^6.1.5
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  firebase_core: ^3.0.0 
  firebase_messaging: ^15.0.0
  image_picker: ^1.2.0
  dotted_border: ^3.1.0
  permission_handler: ^12.0.1
  intl: ^0.20.2
  animations: ^2.0.11
  midtrans_sdk: ^1.0.1
  app_links: ^6.4.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/wave-biz-logo.png"

flutter_native_splash:
  color: "#ffffff" 
  android: true
  ios: true
