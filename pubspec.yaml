name: wa_blast
description: "WaveUp"
publish_to: 'none'
version: 0.2.1+5

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  device_info_plus: ^12.2.0
  flutter:
    sdk: flutter
  http: ^1.4.0
  app_links: ^6.4.1
  lucide_icons: ^0.257.0
  provider: ^6.1.5
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  firebase_core: ^3.0.0 
  firebase_messaging: ^15.0.0
  image_picker: ^1.2.0
  dotted_border: ^3.1.0
  permission_handler: ^12.0.1
  intl: ^0.20.2
  animations: ^2.0.11
  midtrans_sdk: 
    path: ../midtrans_sdk_fixed
  flutter_localizations:
    sdk: flutter
  flutter_gen: ^5.12.0
  pdf: ^3.11.3
  printing: ^5.14.2
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.3
  infinite_scroll_pagination: ^5.1.1
  webview_flutter: ^4.13.0
  flutter_dotenv: ^6.0.0
  flutter_blue_plus: ^2.0.0
  webview_flutter_android: ^4.10.1
  webview_flutter_wkwebview: ^3.23.0
  flutter_image_compress: ^2.4.0
  fl_chart: ^1.1.1
  package_info_plus: ^9.0.0
  google_sign_in: ^7.2.0
  font_awesome_flutter: ^10.12.0
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - .env.dev
    - .env.prod

flutter_icons:
  android: true
  ios: true
  image_path: "assets/wave-biz-logo.png"

flutter_native_splash:
  color: "#ffffff" 
  android: true
  ios: true
